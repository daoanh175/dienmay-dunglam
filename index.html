<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Điện Máy Dũng Lam - Thái Nguyên </title>

  <style>
    body { font-family: Arial, sans-serif; margin:0; background:#f4f6f8; }
    header { background:#0f172a; color:#fff; padding:20px; text-align:center; }
    .container { max-width:1100px; margin:24px auto; padding:0 16px; }
    .products { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; }
    .card { background:#fff; padding:12px; border-radius:8px; box-shadow:0 2px 6px rgba(0,0,0,.1); }
    .price { color:#dc2626; font-weight:bold; }
    button { background:#2563eb; color:#fff; border:none; padding:8px 12px; border-radius:6px; cursor:pointer; }
    button:hover { background:#1d4ed8; }
    .box { background:#fff; padding:16px; border-radius:8px; margin-top:24px; }
    input, textarea { width:100%; padding:8px; margin-bottom:10px; }
    footer { background:#020617; color:#cbd5f5; text-align:center; padding:16px; margin-top:40px; }
  </style>
</head>

<body>

<header>
  <h1>Điện Máy Dũng Lam</h1>
  <p>Trung Nhang – Quân Chu – Thái Nguyên</p>
  <p>📞 0334 269 460 – 0969 528 319</p>
  <a href="https://zalo.me/0334269460" style="color:#22c55e">Zalo cửa hàng</a>
</header>

<div class="container">

  <h2>Sản phẩm</h2>
  <div class="products" id="productList"></div>

  <div class="box">
    <h2>Giỏ hàng</h2>
    <ul id="cartList"></ul>
    <p><strong>Tổng tiền: </strong><span id="total">0</span> VND</p>
  </div>

  <div class="box">
    <h2>Thanh toán & Giao hàng</h2>

    <input id="name" placeholder="Họ tên khách"/>
    <input id="phone" placeholder="Số điện thoại"/>
    <textarea id="address" placeholder="Địa chỉ giao hàng"></textarea>

    <h3>Quét QR chuyển khoản</h3>
    <img id="qr" style="max-width:250px"/>

    <br><br>
    <button onclick="checkout()" style="background:#16a34a">
      Xác nhận đặt hàng (Zalo)
    </button>
  </div>

</div>

<footer>
  © 2026 Điện Máy Dũng Lam – Trung Nhang, Quân Chu, Thái Nguyên
</footer>

<script>
const products = [
  {id:1, name:"Tủ lạnh Aqua 180L", price:4200000},
  {id:2, name:"Máy giặt LG 8kg", price:5300000},
  {id:3, name:"Điều hòa Casper 9000BTU", price:6800000},
  {id:4, name:"Nồi cơm điện Sharp", price:890000}
];

const cart = [];
const productList = document.getElementById("productList");
const cartList = document.getElementById("cartList");
const totalEl = document.getElementById("total");
const qrImg = document.getElementById("qr");

// THAY THÔNG TIN NGÂN HÀNG Ở ĐÂY
const BANK = "MB";
const ACCOUNT = "123456789";
const NAME = "DIEN MAY DUNG LAM";

products.forEach(p => {
  const div = document.createElement("div");
  div.className = "card";
  div.innerHTML = `
    <h3>${p.name}</h3>
    <p class="price">${p.price.toLocaleString()} VND</p>
    <button onclick="addToCart(${p.id})">Thêm vào giỏ</button>
  `;
  productList.appendChild(div);
});

function addToCart(id){
  cart.push(products.find(p=>p.id===id));
  renderCart();
}

function renderCart(){
  cartList.innerHTML="";
  let total=0;
  cart.forEach(i=>{
    const li=document.createElement("li");
    li.textContent=`${i.name} – ${i.price.toLocaleString()} VND`;
    cartList.appendChild(li);
    total+=i.price;
  });
  totalEl.textContent=total.toLocaleString();
  qrImg.src=`https://img.vietqr.io/image/${BANK}-${ACCOUNT}-compact2.png?amount=${total}&addInfo=DIEN+MAY+DUNG+LAM&accountName=${NAME}`;
}

function checkout(){
  if(cart.length===0) return alert("Giỏ hàng trống");
  const name=document.getElementById("name").value;
  const phone=document.getElementById("phone").value;
  const address=document.getElementById("address").value;
  if(!name||!phone||!address) return alert("Nhập đủ thông tin");

  let msg=`ĐƠN HÀNG ĐIỆN MÁY DŨNG LAM%0A`;
  msg+=`Tên: ${name}%0ASĐT: ${phone}%0AĐịa chỉ: ${address}%0A%0A`;
  cart.forEach(i=>msg+=`- ${i.name}: ${i.price.toLocaleString()} VND%0A`);
  msg+=`%0ATổng: ${totalEl.textContent} VND`;

  window.open("https://zalo.me/0334269460?text="+msg);
}
</script>

</body>
</html>
